<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生首页</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h4>欢迎，<span th:text="${session.student.name}"></span></h4>
        <form method="post" action="/logout">
            <button class="btn btn-outline-secondary btn-sm" type="submit">退出登录</button>
        </form>
    </div>
    <div class="mt-4">
        <a href="/student/exams" class="btn btn-primary me-3">参加考试</a>
        <a href="/student/results" class="btn btn-outline-primary">查看成绩</a>
    </div>
</div>
</body>
</html>
