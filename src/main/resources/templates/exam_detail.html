<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>考试答题</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        .countdown-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }
        .countdown-box {
            font-size: 22px;
            font-weight: bold;
            color: #2E5F8A;
        }
        .countdown-box.warning { color: #fd7e14; }
        .countdown-box.danger  { color: #dc3545; }
    </style>
</head>
<body>
<div class="container mt-3">

    <div th:if="${param.error}" class="alert alert-danger" th:text="${param.error}"></div>

    <!-- 顶部倒计时栏 -->
    <div class="countdown-bar">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">答题页面</h5>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted">剩余时间：</span>
                <span class="countdown-box" id="countdown">--:--</span>
                <button type="button" class="btn btn-success btn-sm"
                        onclick="submitConfirm()">提交答卷</button>
            </div>
        </div>
    </div>

    <!-- 答题表单 -->
    <form id="examForm" method="post" action="/student/exam/submit">
        <input type="hidden" name="examId" th:value="${examId}">

        <div th:each="q, i : ${questions}" class="card mb-3">
            <div class="card-body">
                <p class="fw-bold mb-2">
                    <span th:text="${i.index + 1}"></span>.
                    <span th:text="${q['content']}"></span>
                    <span class="text-muted fs-6 fw-normal ms-1">
                        （<span th:text="${q['score']}"></span>分）
                    </span>
                </p>
                <div class="ms-3">
                    <div class="form-check">
                        <label>
                            <input class="form-check-input"
                                   th:type="${q['questionType'] == 2 ? 'checkbox' : 'radio'}"
                                   th:name="'answer_' + ${q['questionId']}" value="A">
                        </label>
                        <label class="form-check-label">
                            A. <span th:text="${q['optionA']}"></span>
                        </label>
                    </div>
                    <div class="form-check">
                        <label>
                            <input class="form-check-input"
                                   th:type="${q['questionType'] == 2 ? 'checkbox' : 'radio'}"
                                   th:name="'answer_' + ${q['questionId']}" value="B">
                        </label>
                        <label class="form-check-label">
                            B. <span th:text="${q['optionB']}"></span>
                        </label>
                    </div>
                    <div class="form-check" th:if="${q['optionC'] != null}">
                        <label>
                            <input class="form-check-input"
                                   th:type="${q['questionType'] == 2 ? 'checkbox' : 'radio'}"
                                   th:name="'answer_' + ${q['questionId']}" value="C">
                        </label>
                        <label class="form-check-label">
                            C. <span th:text="${q['optionC']}"></span>
                        </label>
                    </div>
                    <div class="form-check" th:if="${q['optionD'] != null}">
                        <label>
                            <input class="form-check-input"
                                   th:type="${q['questionType'] == 2 ? 'checkbox' : 'radio'}"
                                   th:name="'answer_' + ${q['questionId']}" value="D">
                        </label>
                        <label class="form-check-label">
                            D. <span th:text="${q['optionD']}"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-5">
            <button type="button" class="btn btn-success"
                    onclick="submitConfirm()">提交答卷</button>
        </div>
    </form>

    <dialog id="submitDialog" class="border-0 rounded-3 shadow p-0">
        <div class="p-4" style="min-width: 320px">
            <h5 class="mb-3">确认提交答卷？</h5>
            <p class="text-muted">提交后将立即评分，且不能再修改答案。</p>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary"
                        onclick="closeSubmitDialog()">继续检查</button>
                <button type="button" class="btn btn-success" id="confirmSubmit"
                        onclick="submitExam()">确认提交</button>
            </div>
        </div>
    </dialog>
</div>

<script th:inline="javascript">
    // 从后端取考试时长（分钟）
    let remainSeconds = '[[${remainSeconds}]]';

    const countdownEl = document.getElementById('countdown');

    function updateDisplay() {
        const m = Math.floor(remainSeconds / 60);
        const s = remainSeconds % 60;
        countdownEl.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');

        // 最后10分钟变橙色
        countdownEl.className = 'countdown-box';
        if (remainSeconds <= 600) countdownEl.classList.add('warning');
        // 最后1分钟变红色
        if (remainSeconds <= 60)  countdownEl.classList.add('danger');
    }

    function submitConfirm() {
        document.getElementById('submitDialog').showModal();
    }

    function closeSubmitDialog() {
        document.getElementById('submitDialog').close();
    }

    function submitExam() {
        window.onbeforeunload = null;
        document.getElementById('confirmSubmit').disabled = true;
        document.getElementById('examForm').submit();
    }

    // 每秒倒计时
    updateDisplay();
    const timer = setInterval(() => {
        remainSeconds--;
        updateDisplay();
        if (remainSeconds <= 0) {
            clearInterval(timer);
            alert('考试时间到，自动提交！');
            window.onbeforeunload = null;
            document.getElementById('examForm').submit();
        }
    }, 1000);

    // 防止误关闭页面
    window.onbeforeunload = function() {
        if (remainSeconds > 0) {
            return '考试还未结束，确认离开？';
        }
    };
</script>
</body>
</html>
