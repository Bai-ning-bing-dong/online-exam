<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生注册</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .register-box {
            width: 480px;
            margin: 60px auto;
            background: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .register-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2E5F8A;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
<div class="register-box">
    <div class="register-title">学生注册</div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post" action="/register">
        <div class="row g-3">
            <div class="col-6">
                <label class="form-label">学号 <span class="text-danger">*</span></label>
                <label>
                    <input type="text" name="studentId" class="form-control"
                           placeholder="如：2023010001" required>
                </label>
            </div>
            <div class="col-6">
                <label class="form-label">姓名 <span class="text-danger">*</span></label>
                <label>
                    <input type="text" name="name" class="form-control"
                           placeholder="请输入姓名" required>
                </label>
            </div>
            <div class="col-6">
                <label class="form-label">班级 <span class="text-danger">*</span></label>
                <label>
                    <input type="text" name="className" class="form-control"
                           placeholder="如：信计231" required>
                </label>
            </div>
            <div class="col-6">
                <label class="form-label">性别 <span class="text-danger">*</span></label>
                <label>
                    <select name="gender" class="form-select" required>
                        <option value="M">男</option>
                        <option value="F">女</option>
                    </select>
                </label>
            </div>
            <div class="col-12">
                <label class="form-label">邮箱（可选）</label>
                <label>
                    <input type="email" name="email" class="form-control"
                           placeholder="请输入邮箱">
                </label>
            </div>
            <div class="col-6">
                <label class="form-label">密码 <span class="text-danger">*</span></label>
                <label>
                    <input type="password" name="password" class="form-control"
                           placeholder="请输入密码" required>
                </label>
            </div>
            <div class="col-6">
                <label class="form-label">确认密码 <span class="text-danger">*</span></label>
                <label>
                    <input type="password" name="confirmPassword" class="form-control"
                           placeholder="再次输入密码" required>
                </label>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100">注册</button>
            </div>
        </div>
    </form>

    <div class="text-center mt-3">
        <a href="/" class="text-muted small">已有账号？返回登录</a>
    </div>
</div>
</body>
</html>
