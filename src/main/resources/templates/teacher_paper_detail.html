<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>组卷</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>组卷页面</h4>
        <a href="/teacher/papers" class="btn btn-outline-secondary btn-sm">返回试卷列表</a>
    </div>

    <div class="row">
        <!-- 左边：试卷已有题目 -->
        <div class="col-md-6">
            <h5 class="mb-3">试卷题目
                <span class="badge bg-primary ms-1" th:text="${#lists.size(questions)}"></span>
            </h5>
            <div th:each="q : ${questions}" class="card mb-2">
                <div class="card-body py-2 d-flex justify-content-between align-items-center">
                    <div>
                        <span class="badge bg-secondary me-1" th:text="${q['questionOrder']}"></span>
                        <span th:text="${q['content']}"></span>
                        <small class="text-muted ms-1">
                            (<span th:text="${q['typeName']}"></span>
                            <span th:text="${q['score']}"></span>分)
                        </small>
                    </div>
                    <form th:action="@{/teacher/paper/{pid}/remove/{qid}(pid=${paperId},qid=${q['questionId']})}"
                          method="post">
                        <button class="btn btn-sm btn-outline-danger">移除</button>
                    </form>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(questions)}" class="text-muted">暂无题目，从右侧添加</p>
        </div>

        <!-- 右边：可添加的题目（带搜索） -->
        <div class="col-md-6">
            <h5 class="mb-2">题库
                <span class="badge bg-success ms-1" id="availableCount"></span>
            </h5>

            <!-- 搜索框 -->
            <div class="row mb-2 g-2">
                <div class="col-8">
                    <label for="searchInput"></label><input type="text" id="searchInput" class="form-control form-control-sm"
                                                            placeholder="搜索题目..." oninput="filterAvailable()">
                </div>
                <div class="col-4">
                    <label for="typeFilter"></label><select id="typeFilter" class="form-select form-select-sm" onchange="filterAvailable()">
                        <option value="">全部题型</option>
                        <option value="单选">单选</option>
                        <option value="判断">判断</option>
                        <option value="多选">多选</option>
                    </select>
                </div>
            </div>

            <!-- 题目列表 -->
            <div id="availableList">
                <div th:each="q : ${available}"
                     class="card mb-2 available-item"
                     th:data-content="${q['content']}"
                     th:data-type="${q['typeName']}">
                    <div class="card-body py-2 d-flex justify-content-between align-items-center">
                        <div>
                            <span th:text="${q['content']}"></span>
                            <small class="text-muted ms-1">
                                (<span th:text="${q['typeName']}"></span>
                                <span th:text="${q['score']}"></span>分)
                            </small>
                        </div>
                        <form th:action="@{/teacher/paper/{pid}/add/{qid}(pid=${paperId},qid=${q['questionId']})}"
                              method="post">
                            <button class="btn btn-sm btn-outline-success">+ 添加</button>
                        </form>
                    </div>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(available)}" class="text-muted">题库已全部加入试卷</p>
            <p id="noResult" style="display:none" class="text-muted text-center">没有找到匹配的题目</p>
        </div>
    </div>
</div>

<script>
    function filterAvailable() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const items = document.querySelectorAll('.available-item');
        let count = 0;

        items.forEach(item => {
            const content = item.getAttribute('data-content').toLowerCase();
            const itemType = item.getAttribute('data-type');
            const match = content.includes(keyword) && (type === '' || itemType === type);
            item.style.display = match ? '' : 'none';
            if (match) count++;
        });

        document.getElementById('availableCount').textContent = count + '';
        document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
    }

    window.onload = function() {
        const items = document.querySelectorAll('.available-item');
        document.getElementById('availableCount').textContent = items.length + '';
    }
</script>
</body>
</html>
