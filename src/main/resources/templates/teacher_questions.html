<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>题库管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>题库管理</h4>
        <div>
            <button class="btn btn-success btn-sm me-2"
                    onclick="document.getElementById('addForm').style.display='block'">
                + 添加题目
            </button>
            <a href="/teacher/index" class="btn btn-outline-secondary btn-sm">返回首页</a>
        </div>
    </div>

    <!-- 搜索和筛选栏 -->
    <div class="row mb-3 g-2">
        <div class="col-md-6">
            <label for="searchInput"></label><input type="text" id="searchInput" class="form-control"
                                                    placeholder="搜索题目内容..." oninput="filterQuestions()">
        </div>
        <div class="col-md-3">
            <label for="typeFilter"></label><select id="typeFilter" class="form-select" onchange="filterQuestions()">
                <option value="">全部题型</option>
                <option value="单选">单选题</option>
                <option value="判断">判断题</option>
                <option value="多选">多选题</option>
            </select>
        </div>
        <div class="col-md-3">
            <span class="form-text text-muted mt-2 d-inline-block">
                共 <span id="countDisplay"></span> 道题
            </span>
        </div>
    </div>

    <!-- 添加题目表单 -->
    <div id="addForm" style="display:none" class="card mb-4">
        <div class="card-body">
            <h6 class="card-title">添加新题目</h6>
            <form method="post" action="/teacher/question/add">
                <div class="mb-2">
                    <label class="form-label">题型</label>
                    <label>
                        <select name="questionType" class="form-select">
                            <option value="1">单选题</option>
                            <option value="3">判断题</option>
                        </select>
                    </label>
                </div>
                <div class="mb-2">
                    <label class="form-label">题干</label>
                    <label>
                        <textarea name="content" class="form-control" rows="2"></textarea>
                    </label>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">选项A</label>
                        <label>
                            <input type="text" name="optionA" class="form-control">
                        </label>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">选项B</label>
                        <label>
                            <input type="text" name="optionB" class="form-control">
                        </label>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">选项C（可选）</label>
                        <label>
                            <input type="text" name="optionC" class="form-control">
                        </label>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">选项D（可选）</label>
                        <label>
                            <input type="text" name="optionD" class="form-control">
                        </label>
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">正确答案（如A或AB）</label>
                        <label>
                            <input type="text" name="correctAnswer" class="form-control">
                        </label>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">分值</label>
                        <label>
                            <input type="number" name="score" class="form-control" value="10">
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">保存题目</button>
                <button type="button" class="btn btn-outline-secondary btn-sm"
                        onclick="document.getElementById('addForm').style.display='none'">
                    取消
                </button>
            </form>
        </div>
    </div>

    <!-- 题目列表 -->
    <table class="table table-bordered table-hover" id="questionTable">
        <thead class="table-primary">
        <tr>
            <th>题号</th>
            <th>题型</th>
            <th>题干</th>
            <th>正确答案</th>
            <th>分值</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="questionBody">
        <tr th:each="q : ${questions}"
            th:data-content="${q['content']}"
            th:data-type="${q['typeName']}">
            <td th:text="${q['questionId']}"></td>
            <td th:text="${q['typeName']}"></td>
            <td th:text="${q['content']}"></td>
            <td th:text="${q['correctAnswer']}"></td>
            <td th:text="${q['score']}"></td>
            <td>
                <a th:href="@{/teacher/question/{id}/edit(id=${q['questionId']})}"
                   class="btn btn-sm btn-outline-primary me-1">修改</a>
                <form th:action="@{/teacher/question/{id}/delete(id=${q['questionId']})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('确认删除该题目？删除后不可恢复')">
                    <button class="btn btn-sm btn-outline-danger">删除</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(questions)}" id="emptyRow">
            <td colspan="5" class="text-center text-muted">暂无题目</td>
        </tr>
        </tbody>
    </table>
    <p id="noResult" style="display:none" class="text-muted text-center">没有找到匹配的题目</p>
</div>

<script>
    function filterQuestions() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const rows = document.querySelectorAll('#questionBody tr[data-content]');
        let count = 0;

        rows.forEach(row => {
            const content = row.getAttribute('data-content').toLowerCase();
            const rowType = row.getAttribute('data-type');
            const matchKeyword = content.includes(keyword);
            const matchType = type === '' || rowType === type;

            if (matchKeyword && matchType) {
                row.style.display = '';
                count++;
            } else {
                row.style.display = 'none';
            }
        });

        document.getElementById('countDisplay').textContent = count + '';
        document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
    }

    // 页面加载时初始化计数
    window.onload = function() {
        const rows = document.querySelectorAll('#questionBody tr[data-content]');
        document.getElementById('countDisplay').textContent = rows.length + '';
    }
</script>
</body>
</html>
