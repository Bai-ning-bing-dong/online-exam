<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩统计</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>考试成绩统计</h4>
        <a href="/teacher/index" class="btn btn-outline-secondary btn-sm">返回首页</a>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-primary">
        <tr>
            <th>课程名称</th>
            <th>参考人数</th>
            <th>最高分</th>
            <th>最低分</th>
            <th>平均分</th>
            <th>及格人数</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${stats}">
            <td th:text="${s.courseName}"></td>
            <td th:text="${s.totalCount}"></td>
            <td th:text="${s.maxScore}"></td>
            <td th:text="${s.minScore}"></td>
            <td th:text="${s.avgScore}"></td>
            <td>
                <span th:text="${s.passCount}"></span>
                /
                <span th:text="${s.totalCount}"></span>
            </td>
            <td>
                <a th:href="@{/teacher/results/{id}(id=${s.examId})}"
                   class="btn btn-sm btn-outline-primary">查看明细</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(stats)}">
            <td colspan="7" class="text-center text-muted">暂无考试数据</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
