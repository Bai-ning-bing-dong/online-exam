<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>教师首页</title>
    <link th:href="@{/bootstrap5/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center">
        <h4>欢迎，<span th:text="${session.teacher.name}"></span> 老师</h4>
        <form method="post" action="/logout">
            <button class="btn btn-outline-secondary btn-sm" type="submit">退出登录</button>
        </form>
    </div>
    <div class="mt-4">
        <a href="/teacher/questions" class="btn btn-primary me-2">题库管理</a>
        <a href="/teacher/papers" class="btn btn-primary me-2">试卷管理</a>
        <a href="/teacher/exams" class="btn btn-primary me-2">考试管理</a>
        <a href="/teacher/results" class="btn btn-outline-primary">成绩统计</a>
    </div>
</div>
</body>
</html>
